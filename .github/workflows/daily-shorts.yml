name: Daily Auto Shorts with Multi-Platform Upload

on:
  schedule:
    - cron: "55 6 * * *"      # Once daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Cache Vosk Model
      uses: actions/cache@v4
      with:
        path: vosk-model-small-de-0.15
        key: vosk-model-small-de-0.15

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check and generate topics if needed
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'sk_B0I1QMA8hWP14sICrnx1S1pt8riQdpLZ' }}
      run: |
        python generate_topics.py

    - name: Generate daily short video
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'sk_B0I1QMA8hWP14sICrnx1S1pt8riQdpLZ' }}
        GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      run: |
        python main.py

    - name: Upload to YouTube Shorts
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || 'sk_B0I1QMA8hWP14sICrnx1S1pt8riQdpLZ' }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: |
        python upload_all_platforms.py

    - name: Commit updated topics and tracking files
      if: always()
      run: |
        set +e
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if grep -rlE '^(<<<<<<<|=======|>>>>>>>)' topics.txt used_topics.txt used_images.json output/ 2>/dev/null; then
          echo "ERROR: conflict markers found, refusing to commit"
          exit 1
        fi
        python -c "import json,os; f='used_images.json'; json.load(open(f,encoding='utf-8')) if os.path.exists(f) else None" 2>/dev/null || rm -f used_images.json
        git add topics.txt used_topics.txt used_images.json output/story_en.txt output/topic.txt output/story.txt 2>/dev/null
        git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; echo "WARNING: rebase failed"; }
        git diff --cached --name-only | while read -r f; do
          if [ -f "$f" ] && grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$f" 2>/dev/null; then
            echo "WARNING: un-staging conflict file $f"
            git reset -q -- "$f"
          fi
        done
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update: track used topics and images [skip ci]"
        else
          echo "No changes to commit"
        fi
        git push || { sleep 5; git push; }
        exit 0
